## Testing Alerts

### Simulate High Anomaly Rate
```bash
# In a loop, generate many anomalies
for i in {1..15}; do
  # Make requests that trigger anomalies
  curl http://localhost:3020/api/anomaly-trigger &
done
wait
# Alert should fire within 10 minutes
```

### Simulate High Memory Usage
```bash
# Temporarily disable garbage collection (not recommended for production!)
# Or load large amounts of data
NODE_OPTIONS=--expose-gc npm run start:dev
# In another terminal:
node -e "require('vm').runInThisContext('while(true) {}');"
```

### Simulate Service Down
```bash
# Stop the backend
Ctrl+C (in npm run start:dev terminal)
# Alert should fire within 1-2 minutes
```

