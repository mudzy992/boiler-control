name: Backend audit tests

on:
  push:
    branches: [arena/94541967-boiler-control]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Manual dispatch is also restricted to this session's branch.
    if: github.ref == 'refs/heads/arena/94541967-boiler-control'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_DB: audit
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit -d audit"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://audit@127.0.0.1:5432/audit
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '5432'
      DATABASE_USER: audit
      DATABASE_NAME: audit
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Create ephemeral test-only configuration
        run: |
          test_value="$(openssl rand -hex 24)"
          echo "::add-mask::$test_value"
          echo "DATABASE_PASSWORD=$test_value" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$test_value" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/audit-uploads"
          echo "UPLOAD_ROOT_PATH=$RUNNER_TEMP/audit-uploads" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare isolated database and Prisma client
        id: prepare
        run: |
          npm run generate:prisma
          npx prisma migrate deploy
      - name: Verify temporary Redis
        run: docker exec "${{ job.services.redis.id }}" redis-cli ping
      - name: Lint without modifying files
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          set +e
          npx eslint 'src/**/*.ts' 'test/**/*.ts' --ignore-pattern 'src/generated/**' --format json > "$RUNNER_TEMP/audit-eslint.json"
          result=$?
          node ../scripts/audit/ci_diagnostics.cjs eslint "$RUNNER_TEMP/audit-eslint.json"
          report_result=$?
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          exit "$report_result"
      - name: Type-check
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          set +e
          npx tsc --noEmit --incremental false --declaration false --types node,jest > "$RUNNER_TEMP/audit-tsc.txt" 2>&1
          result=$?
          node ../scripts/audit/ci_diagnostics.cjs tsc "$RUNNER_TEMP/audit-tsc.txt"
          report_result=$?
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          exit "$report_result"
      - name: Build
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: npm run build
      - name: Existing tests and coverage
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          set +e
          npm test -- --runInBand --forceExit --coverage --json --outputFile="$RUNNER_TEMP/audit-jest.json"
          result=$?
          node ../scripts/audit/jest_report.cjs "$RUNNER_TEMP/audit-jest.json"
          report_result=$?
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          exit "$report_result"
      - name: Existing integration tests
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          set +e
          npm run test:integration -- --json --outputFile="$RUNNER_TEMP/audit-integration.json"
          result=$?
          node ../scripts/audit/jest_report.cjs "$RUNNER_TEMP/audit-integration.json"
          report_result=$?
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          exit "$report_result"
