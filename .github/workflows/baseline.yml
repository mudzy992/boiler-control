name: Baseline (read-only)

# Mjerenje stanja iz PRODUKCIONE baze, bez ijednog upisa (`19` §5).
#
# Zašto ručno pokretanje: ovo čita stvarne korisničke podatke. Ne smije se
# pokretati na svaki push, niti slati podatke bilo gdje osim u summary job-a.
#
# Kredencijal: `DATABASE_URL_READONLY`. Skripta namjerno ne pada na
# `DATABASE_URL` — baseline smije čitati kredencijalom koji ne može pisati,
# čak i kad bi kod imao grešku. Sesija se dodatno postavlja na `read only` na
# strani servera.

on:
  workflow_dispatch:
  # GitHub registruje workflow za `workflow_dispatch` samo ako fajl ima i drugi
  # trigger. Ova grana ne postoji, pa se baseline **nikad** ne pokreće sam —
  # filter služi isključivo registraciji. Bez njega `gh workflow run` vraća 404.
  push:
    branches: [baseline-ne-pokreci-sam]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Baseline
        env:
          DATABASE_URL_READONLY: ${{ secrets.DATABASE_URL_READONLY }}
        run: node scripts/baseline-readonly.cjs

      # Brojevi idu i kao anotacije: u ovom okruženju se log job-a ne može
      # preuzeti, a upravo su brojevi ono po što se ovaj workflow pokreće.
      - name: Publish headline numbers
        if: always()
        run: |
          if [ -f "$GITHUB_STEP_SUMMARY" ]; then
            echo "Summary je napisan ($(wc -l < "$GITHUB_STEP_SUMMARY") linija)."
          fi
