name: Audit checks

on:
  push:
    branches: [arena/1bfee051-boiler-control]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Manual dispatch is also restricted to this session's branch.
    if: github.ref == 'refs/heads/arena/1bfee051-boiler-control'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_DB: audit
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit -d audit"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://audit@127.0.0.1:5432/audit
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '5432'
      DATABASE_USER: audit
      DATABASE_NAME: audit
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Create ephemeral test-only configuration
        run: |
          test_value="$(openssl rand -hex 24)"
          echo "::add-mask::$test_value"
          echo "DATABASE_PASSWORD=$test_value" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$test_value" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/audit-uploads"
          echo "UPLOAD_ROOT_PATH=$RUNNER_TEMP/audit-uploads" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare isolated database and Prisma client
        id: prepare
        run: |
          npm run generate:prisma
          npx prisma migrate deploy
      - name: Reproduce notification authorization in disposable PostgreSQL
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          AUDIT_DISPOSABLE_POSTGRES: '1'
        run: node ../scripts/audit/http_postgres_repro.cjs --ci
      - name: Reproduce seed target isolation in disposable PostgreSQL
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          AUDIT_DISPOSABLE_POSTGRES: '1'
        run: node ../scripts/audit/seed_isolation_repro.cjs --ci
      - name: Verify temporary Redis
        run: docker exec "${{ job.services.redis.id }}" redis-cli ping
      - name: Verify Redis lease primitives in disposable service
        env:
          AUDIT_DISPOSABLE_REDIS: '1'
          AUDIT_REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: node ../scripts/audit/redis_lease_ci.cjs --ci
      - name: Lint without modifying files
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          set +e
          npx eslint 'src/**/*.ts' 'test/**/*.ts' --ignore-pattern 'src/generated/**' --format json > "$RUNNER_TEMP/audit-eslint.json"
          result=$?
          node ../scripts/audit/ci_diagnostics.cjs eslint "$RUNNER_TEMP/audit-eslint.json"
          report_result=$?
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          exit "$report_result"
      - name: Type-check
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          set +e
          npx tsc --noEmit --incremental false --declaration false --types node,jest > "$RUNNER_TEMP/audit-tsc.txt" 2>&1
          result=$?
          node ../scripts/audit/ci_diagnostics.cjs tsc "$RUNNER_TEMP/audit-tsc.txt"
          report_result=$?
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          exit "$report_result"
      - name: Build
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: npm run build
      # API-2: ugovor mora ostati usklađen s komitovanim artefaktom.
      # `prepare` je već pokrenuo `generate:prisma`, pa generator može
      # instancirati aplikaciju. Pad znači da je neko promijenio rutu/DTO a
      # nije regenerisao `contracts/openapi.json` — tj. potencijalno
      # nekompatibilna promjena za frontend/mobile koji iz njega generišu tipove.
      - name: OpenAPI contract in sync (API-2)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: npm run openapi:generate -- --check
      - name: Existing tests and coverage
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          set +e
          npm test -- --runInBand --forceExit --coverage --coverageReporters=json-summary --coverageReporters=json --coverageReporters=text --coverageReporters=lcov --coverageReporters=clover --json --outputFile="$RUNNER_TEMP/audit-jest.json"
          result=$?
          node ../scripts/audit/jest_report.cjs "$RUNNER_TEMP/audit-jest.json"
          report_result=$?
          node ../scripts/audit/coverage_summary.cjs ../coverage/coverage-summary.json
          coverage_result=$?
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          if [ "$report_result" -ne 0 ]; then exit "$report_result"; fi
          exit "$coverage_result"
      - name: Existing integration tests
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          set +e
          npm run test:integration -- --json --outputFile="$RUNNER_TEMP/audit-integration.json"
          result=$?
          node ../scripts/audit/jest_report.cjs "$RUNNER_TEMP/audit-integration.json"
          report_result=$?
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          exit "$report_result"

  # FE2-16: frontend provjere. Odvojen job jer `test` ima
  # `defaults.run.working-directory: backend` i ovisi o postgres/redis
  # servisima koji frontendu nisu potrebni.
  frontend:
    if: github.ref == 'refs/heads/arena/1bfee051-boiler-control'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # FE2-7: jedna vrijednost za build I za e2e, da e2e ne moze prolaziti nad
      # drugim base-om nego sto je ugradjen u bundle.
      VITE_API_URL: https://api.boiler-control.ba101.top/api
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # FE2-8: generisani tipovi moraju odgovarati ugovoru. Backend korak
      # "OpenAPI contract in sync" čuva `contracts/openapi.json` u skladu s
      # kontrolerima; ovaj korak čuva `src/types/api.d.ts` u skladu s tim
      # ugovorom. Bez njega bi promjena ugovora prošla CI a da frontend
      # tipovi ostanu zastarjeli — tačno onaj tihi raskid koji FE2-8 brani.
      - name: OpenAPI types in sync (FE2-8)
        run: npm run openapi:check
      - name: Type-check
        run: npm run type-check
      # FE2-7: e2e fajlovi zive izvan `src`, pa ih `tsconfig.app.json` ne vidi.
      # Bez ovog koraka ne prolaze kroz nijednu provjeru - a e2e se ne moze
      # uvijek ni izvrsiti (treba Chromium), pa je type-check minimum.
      - name: Type-check e2e (FE2-7)
        run: npm run type-check:e2e
      - name: Lint
        run: npm run lint
      # FE2-11: frontend je do sada imao nula testova (FE-014) - CI je provjeravao
      # samo tipove, lint i build, pa je regresija u poslovnoj logici (npr.
      # obrnut predznak potrosnje plina) prolazila neprimijeceno. Vitest pokriva
      # GasForm validaciju, GasReadingCard izracun potrosnje i i18n fallback.
      # Mutacijski testirano: svaka od te tri jedinice pada na namjerno unesenoj
      # gresci, pa suite nije dekorativan.
      - name: Unit and component tests (FE2-11)
        run: npm test
      # FE2-7: mjerodavna deploy konfiguracija. `frontend/docker-compose.yml`
      # je obrisan jer je bio proturjecan korijenskom setu (port 3021 vs nginx
      # `listen 80`, drugaciji API host). Bez ove provjere takav raskid bi se
      # mogao vratiti a da CI ostane zelen.
      - name: Deploy config consistent (FE2-7)
        working-directory: .
        run: |
          set -euo pipefail
          test ! -f frontend/docker-compose.yml
          docker compose -f docker-compose.yml config --quiet
          echo "docker compose config: OK"
          node scripts/audit/frontend_deploy_config_repro.cjs
      # `requireApiBaseUrl()` u vite.config.ts rusi build ako VITE_API_URL
      # izostane. Bez toga je nekada tiho ugradjivan http://localhost:3020/api.
      - name: Build
        run: npm run build
      # Dokaz da je build arg zaista zavrsio u bundleu, a ne samo u configu.
      - name: Verify embedded API base (FE2-7)
        run: |
          set -euo pipefail
          echo "Ocekivani base: $VITE_API_URL"
          grep -rl -- "$VITE_API_URL" dist/assets/*.js > /tmp/hits.txt
          test -s /tmp/hits.txt
          echo "Ugradjeno u: $(wc -l < /tmp/hits.txt) cip(ova)"
          if grep -rql 'localhost:3020' dist/ ; then
            echo "GRESKA: dev fallback je procurio u bundle" >&2
            grep -rl 'localhost:3020' dist/ >&2
            exit 1
          fi
          echo "localhost:3020 u dist/: nema"
      - name: Install Playwright browsers (FE2-7)
        run: npx playwright install --with-deps chromium
      # Smoke nad SAGRADJENIM dist/: SPA se pokrene, API poziv ide na ugradjeni
      # base, nijedan zahtjev ne ide na uklonjeni dev fallback.
      - name: E2E smoke (FE2-7)
        run: npm run test:e2e
