name: Backend build

# Build gate za backend — isti koraci koje izvršava `backend/Dockerfile`
# (`prisma generate` → `nest build`), plus provjera da migracije stvarno prolaze
# na praznoj PostgreSQL bazi.
#
# Zašto postoji: `backend-audit.yml` se pokreće samo na dvije arhivirane grane,
# pa se backend od tada builduje **samo na Coolify**. Greška u shemi, migraciji
# ili `nest-cli.json` assetima tako stiže tek u deploy, bez ijednog loga u CI-u.
#
# `test` job je drugi, potrebniji dio: jedini način da se sazna da li suiteovi
# koji traže bazu (ugovor, transakcije, health) prolaze, a ne samo da padaju
# zbog nedostajuće okoline. Bez baze u CI-u „37 padajućih testova" je bilo
# nemoguće razlikovati od „37 stvarnih grešaka". 

on:
  workflow_dispatch:
    inputs:
      # Baseline čita PRODUKCIONU bazu (samo čitanje) — zato je zaseban prekidač,
      # a ne dio redovnog build-a. Ručno: `gh workflow run backend-build.yml -f baseline=true`.
      baseline:
        description: 'Pročitaj baseline iz produkcije (read-only)'
        type: boolean
        default: false
      # Upis u PRODUKCIJU. Zaseban prekidač od `baseline`, jer čitanje i pisanje
      # ne smiju dijeliti jednu odluku: `baseline=true` nikad ne piše, a
      # `backfill_apply=true` traži `DATABASE_URL_BACKFILL` i upisuje redove za
      # prošle dane. Prvo se u istom jobu ispiše dry-run, pa se upisuje.
      backfill_apply:
        description: 'UPIŠI rekonstruisane DailyRecord redove u produkciju'
        type: boolean
        default: false
  push:
    # `arena/**` kao u `frontend-ci.yml`: radna grana mora biti pokrivena, inače
    # se backend ne testira dok se ne spoji — a pad (run `42920655959`) se otkrije
    # tek poslije merge-a. Fiksna grana je ostala zbog starih run-ova.
    branches: [main, 'arena/**', arena/da41e5ba-boiler-control]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-build.yml'

permissions:
  contents: read

env:
  # Zajednička okolina za oba job-a. `PrismaService` traži SVA ČETIRI imena
  # (host/user/password/name) da bi se uopšte povezao; prazna lozinka ga tiho
  # ostavlja bez baze, pa je lozinka ovdje obavezna i za trust-auth Postgres.
  DATABASE_HOST: 127.0.0.1
  DATABASE_PORT: '5432'
  DATABASE_USER: build
  DATABASE_PASSWORD: build
  DATABASE_NAME: build
  DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
  JWT_SECRET: ci-only-secret-never-used-outside-tests
  UPLOAD_ROOT_PATH: ${{ github.workspace }}/uploads

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: build
          POSTGRES_PASSWORD: build
          POSTGRES_DB: build
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U build -d build"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `--ignore-scripts` kao u audit workflow-u: Prisma postinstall se preskače,
      # klijent se generiše eksplicitno korak ispod.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run generate:prisma

      # Migracije na praznoj bazi: hvata i SQL grešku i pogrešan redoslijed.
      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy

      # Idempotentnost: drugi prolaz ne smije ništa primijeniti ni pući.
      - name: Apply migrations again (must be a no-op)
        run: npx prisma migrate deploy

      # Greška se objavljuje kao anotacija: u ovom okruženju log job-a se ne može
      # preuzeti (redirect na blob storage), a anotacije idu kroz API.
      - name: Build (nest build)
        run: |
          set +e
          npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error::nest build nije prošao (exit $code)"
            # `--pretty false`: boje i code-frame bi sakrili same poruke od grep-a.
            npx tsc -p tsconfig.build.json --noEmit --pretty false 2>&1 \
              | grep -E "error TS" | head -12 \
              | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$code"

      # Asset iz `nest-cli.json`: ako se `catalog.json` ne kopira u `dist`, build
      # prolazi a aplikacija padne pri prvom zahtjevu.
      - name: Catalog asset reached dist
        run: test -f dist/src/modules/BoilerCatalog/catalog.json

      - name: Compiled catalog loads and fails closed
        run: |
          node -e "
            const c = require('./dist/src/modules/BoilerCatalog/boiler-catalog.js');
            if (!c.BOILER_CATALOG_OK) {
              console.error('Katalog nije ispravan:', c.BOILER_CATALOG_ISSUES);
              process.exit(1);
            }
            const family = c.findBoilerFamily('vaillant-ecotec-plus-vuw');
            console.log('porodica:', family && family.id, '| savjet dozvoljen:', c.isFlowAdviceAllowed(family));
            console.log('plafon (sistem 40):', c.effectiveCeilingC({ systemMaxC: 40, family }));
          "

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: build
          POSTGRES_PASSWORD: build
          POSTGRES_DB: build
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U build -d build"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run generate:prisma

      # Ista shema koju će deploy primijeniti — testovi ne smiju trčati na
      # bazi koja se razlikuje od produkcione.
      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Unit + contract tests
        run: |
          set +e
          npx jest --runInBand --ci 2>&1 | tee "$RUNNER_TEMP/jest.log"
          code=${PIPESTATUS[0]}
          # I brojevi idu kao anotacija: log job-a se u ovom okruženju ne može
          # preuzeti, pa bi inače „prošlo" bilo tvrdnja bez iskaza o tome
          # koliko je testova uopšte izvršeno.
          grep -E "^(Test Suites:|Tests:)" "$RUNNER_TEMP/jest.log" \
            | while IFS= read -r line; do echo "::notice::$line"; done
          if [ "$code" -ne 0 ]; then
            # Anotacije, jer se log job-a u ovom okruženju ne može preuzeti.
            echo "::error::jest nije prošao (exit $code)"
            grep -E "^(FAIL|Tests:|Test Suites:)" "$RUNNER_TEMP/jest.log" | head -20 \
              | while IFS= read -r line; do echo "::error::$line"; done
            grep -E "^\s+● " "$RUNNER_TEMP/jest.log" | head -20 \
              | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$code"

  # Namjerno u ovom fajlu, a ne kao zaseban workflow: GitHub registruje
  # `workflow_dispatch` samo za workflow koji je već imao pokretanje, pa bi
  # zaseban baseline workflow bio nedostupan (404) dok ga nešto ne pokrene.
  # Zajedno sa `inputs.baseline` to znači: build se nikad ne miješa sa čitanjem
  # produkcije, a pokretanje je jedna komanda.
  baseline:
    if: github.event_name == 'workflow_dispatch' && (inputs.baseline || inputs.backfill_apply)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Baseline (read-only)
        env:
          DATABASE_URL_READONLY: ${{ secrets.DATABASE_URL_READONLY }}
        run: node scripts/baseline-readonly.cjs

      # Koliko se `DailyRecord`-a može rekonstruisati iz postojećih podataka —
      # mjeri se prije nego se napiše ijedan backfill red.
      - name: Backfill coverage (read-only)
        env:
          DATABASE_URL_READONLY: ${{ secrets.DATABASE_URL_READONLY }}
        run: node scripts/backfill-coverage.cjs

      # F3.7: shadow vs. predlog nad stvarnim podacima. Pušta istu funkciju koju
      # koristi HTTP ruta (`shadow-report.ts`), samo čita bazu direktno — pa se
      # izvještaj dobija i bez prijavljivanja na aplikaciju. Samo SELECT.
      # Prvo bez baze: ako modul ne može da se učita (tsconfig, transpile), pad
      # mora da bude imenovan prije konekcije — inače izgleda kao problem baze.
      - name: Shadow report self-test (F3.7)
        run: node scripts/shadow-report-readonly.cjs --self-test

      - name: Shadow vs. predlog (F3.7, read-only)
        env:
          DATABASE_URL_READONLY: ${{ secrets.DATABASE_URL_READONLY }}
        run: node scripts/shadow-report-readonly.cjs

      # Dry-run: ista logika koja bi i upisivala, ali bez upisa. Ovdje se vidi
      # koliko bi redova nastalo i od kojih izvora, prije nego se odluči.
      - name: Backfill daily records (dry-run, read-only)
        env:
          DATABASE_URL_READONLY: ${{ secrets.DATABASE_URL_READONLY }}
        run: npm run backfill:daily -- --dry-run

      # Upis je odvojen korak i odvojen kredencijal. `ON CONFLICT DO NOTHING`
      # i jedna transakcija: ponovni run ne pravi duplikate, a prekinut run ne
      # ostavlja pola historije.
      - name: Backfill daily records (APPLY)
        if: inputs.backfill_apply
        env:
          DATABASE_URL_BACKFILL: ${{ secrets.DATABASE_URL_BACKFILL }}
        run: npm run backfill:daily -- --apply
