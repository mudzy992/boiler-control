services:
  boiler-control-backend:
    container_name: boiler-control-backend
    image: boiler-control-backend-image
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - TZ=Europe/Sarajevo
      - APP_PORT=3020
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /mnt/shared-app-files/boiler-control:/usr/src/app/uploads:rw
    networks:
      - web
    restart: unless-stopped
    expose:
      - "3020"
    labels:
      - "traefik.enable=true"

      # ROUTER
      - "traefik.http.routers.boiler-backend.rule=Host(`boiler-control.hopto.org`) && PathPrefix(`/backend/`)"
      - "traefik.http.routers.boiler-backend.entrypoints=websecure"
      - "traefik.http.routers.boiler-backend.tls=true"
      - "traefik.http.routers.boiler-backend.tls.certresolver=le"

      # SERVICE
      - "traefik.http.services.boiler-backend.loadbalancer.server.port=3020"

      # STRIP PREFIX
      - "traefik.http.middlewares.boiler-strip.stripprefix.prefixes=/backend"
      - "traefik.http.routers.boiler-backend.middlewares=boiler-strip"

  boiler-control-frontend:
    container_name: boiler-control-frontend
    image: boiler-control-frontend-image
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        - VITE_API_URL=/backend/api
    networks:
      - web
    restart: unless-stopped
    expose:
      - "3021"
    labels:
      - "traefik.enable=true"

      # FRONTEND ROUTER (root domena)
      - "traefik.http.routers.boiler-frontend.rule=Host(`boiler-control.hopto.org`)"
      - "traefik.http.routers.boiler-frontend.entrypoints=websecure"
      - "traefik.http.routers.boiler-frontend.tls=true"
      - "traefik.http.routers.boiler-frontend.tls.certresolver=le"

      # SERVICE
      - "traefik.http.services.boiler-frontend.loadbalancer.server.port=3021"

networks:
  web:
    external: true
