<!-- boiler-control-icon-master.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF5500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF4500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="innerFlameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    <filter id="flameShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#FF4500" flood-opacity="0.5"/>
    </filter>
    <filter id="glowEffect">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bgGrad)"/>

  <!-- Subtle inner border -->
  <rect x="20" y="20" width="984" height="984" rx="200" ry="200" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Boiler body (circular shape) -->
  <circle cx="512" cy="540" r="280" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="12"/>

  <!-- Temperature gauge arc -->
  <path d="M 320 680 A 240 240 0 0 1 704 680" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="8" stroke-linecap="round"/>

  <!-- Gauge tick marks -->
  <line x1="340" y1="660" x2="360" y2="640" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <line x1="400" y1="720" x2="415" y2="695" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <line x1="512" y1="740" x2="512" y2="715" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="624" y1="720" x2="609" y2="695" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <line x1="684" y1="660" x2="664" y2="640" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

  <!-- Gauge needle -->
  <line x1="512" y1="680" x2="600" y2="620" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <circle cx="512" cy="680" r="12" fill="white"/>

  <!-- Main flame - outer -->
  <g filter="flameShadow">
    <path d="
      M 512 280
      C 512 280, 580 340, 600 400
      C 620 460, 610 490, 590 510
      C 620 480, 640 440, 630 390
      C 650 430, 660 480, 640 530
      C 620 580, 570 600, 512 610
      C 454 600, 404 580, 384 530
      C 364 480, 374 430, 394 390
      C 384 440, 404 480, 434 510
      C 414 490, 404 460, 424 400
      C 444 340, 512 280, 512 280
      Z" fill="white" opacity="0.95"/>
  </g>

  <!-- Inner flame -->
  <path d="
    M 512 360
    C 512 360, 555 400, 565 440
    C 575 480, 560 520, 512 540
    C 464 520, 449 480, 459 440
    C 469 400, 512 360, 512 360
    Z" fill="url(#innerFlameGrad)" opacity="0.9"/>

  <!-- Small center flame detail -->
  <path d="
    M 512 410
    C 512 410, 535 435, 535 465
    C 535 490, 525 505, 512 510
    C 499 505, 489 490, 489 465
    C 489 435, 512 410, 512 410
    Z" fill="#FF8C00" opacity="0.8"/>

  <!-- Top pipe/vent detail -->
  <rect x="490" y="180" width="44" height="80" rx="8" fill="rgba(255,255,255,0.3)"/>
  <rect x="480" y="170" width="64" height="20" rx="6" fill="rgba(255,255,255,0.4)"/>

  <!-- Steam wisps from top -->
  <path d="M 500 160 C 495 140, 505 120, 498 100" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 520 155 C 525 130, 515 115, 522 95" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3" stroke-linecap="round"/>

  <!-- Bottom text area -->
  <text x="512" y="850" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="72" fill="white" text-anchor="middle" letter-spacing="8">BOILER</text>
  <text x="512" y="920" font-family="Arial, Helvetica, sans-serif" font-weight="300" font-size="56" fill="rgba(255,255,255,0.8)" text-anchor="middle" letter-spacing="12">CONTROL</text>
</svg>
