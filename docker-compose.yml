networks:
  boiler-control-network:
    name: boiler-control-network

services:
  boiler-control-backend:
    networks:
      - boiler-control-network
    container_name: boiler-control-backend
    image: boiler-control-backend-image
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3020:3020"
    env_file:
      - ./backend/.env
    volumes:
      - /mnt/shared-app-files/boiler-control:/usr/src/app/uploads:rw
    restart: unless-stopped

