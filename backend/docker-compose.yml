services:
  boiler-control-backend:
    container_name: boiler-control-backend
    image: boiler-control-backend-image
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      - TZ=Europe/Sarajevo
      - APP_PORT=3020
      - UPLOAD_ROOT_PATH=/usr/src/app/uploads
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /mnt/shared-app-files/boiler-control:/usr/src/app/uploads:rw
    networks:
      - web
    restart: unless-stopped
    expose:
      - "3020"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.boiler-backend.rule=Host(`boiler-control.hopto.org`) && PathPrefix(`/backend/`)"
      - "traefik.http.routers.boiler-backend.entrypoints=websecure"
      - "traefik.http.routers.boiler-backend.tls=true"
      - "traefik.http.routers.boiler-backend.tls.certresolver=le"
      - "traefik.http.services.boiler-backend.loadbalancer.server.port=3020"
      - "traefik.http.middlewares.boiler-strip.stripprefix.prefixes=/backend"
      - "traefik.http.routers.boiler-backend.middlewares=boiler-strip"

networks:
  web:
    external: true
