# Apache VirtualHost Configuration for Boiler Control
# Fixed CSP headers and proxy configuration

<VirtualHost *:443>
    ServerName boiler-control.hopto.org

    # Preusmjeri /backend na Docker backend
    ProxyPass /backend/ http://localhost:3020/
    ProxyPassReverse /backend/ http://localhost:3020/
    ProxyPreserveHost On

    # Preusmjeri sve ostalo na frontend
    ProxyPass / http://localhost:3021/
    ProxyPassReverse / http://localhost:3021/
    ProxyPreserveHost On

    # SSL postavke
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/boiler-control.hopto.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/boiler-control.hopto.org/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # CORS Headers for API calls
    Header always set "Access-Control-Allow-Origin" "https://boiler-control.hopto.org"
    Header always set "Access-Control-Allow-Methods" "GET, POST, PUT, DELETE, OPTIONS, PATCH"
    Header always set "Access-Control-Allow-Headers" "Content-Type, Authorization, X-Requested-With"
    Header always set "Access-Control-Allow-Credentials" "true"

    # Handle OPTIONS requests
    <If "%{REQUEST_METHOD} == 'OPTIONS'">
        Header always set "Access-Control-Max-Age" "86400"
    </If>

    # Security Headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Fixed Content-Security-Policy
    Header always set Content-Security-Policy "default-src 'self'; connect-src 'self' https://boiler-control.hopto.org wss://boiler-control.hopto.org; img-src 'self' data: blob: https:;style-src 'self' 'unsafe-inline';script-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none';  base-uri 'self'; form-action 'self'"

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/boiler-control_error.log
    CustomLog ${APACHE_LOG_DIR}/boiler-control_access.log combined

    # Enable mod_rewrite for better handling
    <IfModule mod_rewrite.c>
        RewriteEngine On

        # If it's not a file or directory, send to frontend
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule !^/backend/ - [L]
    </IfModule>
</VirtualHost>

# Redirect HTTP to HTTPS
<VirtualHost *:80>
    ServerName boiler-control.hopto.org
    Redirect permanent / https://boiler-control.hopto.org/
</VirtualHost>
