<!doctype html>
<!--
  FE2-6: `lang` je ovdje samo početni fallback (i18next fallbackLng je 'en-US').
  Stvarnu vrijednost postavlja src/locales/config.ts iz i18next stanja, pa više
  nije statički "en" bez obzira na odabrani jezik.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      FE2-6: sve tri favicon reference bile su slomljene — pokazivale su na
      /favicon-16x16.png i /favicon-32x32.png, a public/ stvarno sadrži
      favicon-16.png, favicon-16.svg i favicon-32.png. Prva linija je uz to
      deklarirala type="image/svg+xml" a ciljala na .png.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon-16.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- FE2-6: najčešći accent u UI kodu (#f59e0b). -->
    <meta name="theme-color" content="#f59e0b" />
    <!--
      FE2-13 (FE-021): klasa `dark` se do sada postavljala React useEffect-om u
      ThemeContext.tsx, dakle NAKON prvog rendera. Dark-mode korisnik je zato pri
      svakom reloadu kratko vidio svijetlu verziju (FOUC). Ova skripta je inline i
      izvršava se prije rendera, pa je prva naslikana slika već u pravoj temi.

      Ključ MORA ostati usklađen s THEME_STORAGE_KEY u src/context/ThemeContext.tsx
      ('boiler.theme'); test src/components/__tests__/themeFouc.test.ts to čuva.
    -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('boiler.theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          // localStorage nedostupan (npr. private mode) — ostaje svijetla tema,
          // što je i zadano ponašanje ThemeContext-a.
        }
      })();
    </script>
    <title>Boiler Control</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
