services:
  boiler-control-backend:
    container_name: boiler-control-backend
    image: boiler-control-backend-image
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - TZ=Europe/Sarajevo
      - APP_PORT=3020
      - UPLOAD_ROOT_PATH=/usr/src/app/uploads
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /mnt/shared-app-files/boiler-control:/usr/src/app/uploads:rw
    networks:
      - web
    restart: unless-stopped
    expose:
      - "3020"
    labels:
      - "traefik.enable=true"

      # ROUTER
      - "traefik.http.routers.boiler-backend.rule=Host(`boiler.ba101.top`) && PathPrefix(`/backend/`)"
      - "traefik.http.routers.boiler-backend.entrypoints=websecure"
      - "traefik.http.routers.boiler-backend.tls=true"
      - "traefik.http.routers.boiler-backend.tls.certresolver=le"

      # SERVICE
      - "traefik.http.services.boiler-backend.loadbalancer.server.port=3020"

      # STRIP PREFIX
      - "traefik.http.middlewares.boiler-strip.stripprefix.prefixes=/backend"
      - "traefik.http.routers.boiler-backend.middlewares=boiler-strip,boiler-security-headers"

  boiler-control-frontend:
    container_name: boiler-control-frontend
    image: boiler-control-frontend-image
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/backend/api
    networks:
      - web
    restart: unless-stopped
    expose:
      - "3021"
    labels:
      - "traefik.enable=true"

      # FRONTEND ROUTER (root domena)
      - "traefik.http.routers.boiler-frontend.rule=Host(`boiler.ba101.top`)"
      - "traefik.http.routers.boiler-frontend.entrypoints=websecure"
      - "traefik.http.routers.boiler-frontend.tls=true"
      - "traefik.http.routers.boiler-frontend.tls.certresolver=le"
      - "traefik.http.routers.boiler-frontend.middlewares=boiler-security-headers"
      # SERVICE
      - "traefik.http.services.boiler-frontend.loadbalancer.server.port=3021"

      # SECURITY HEADERS (replacement for Apache vhost headers)
      - "traefik.http.middlewares.boiler-security-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.boiler-security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.boiler-security-headers.headers.frameDeny=false"
      - "traefik.http.middlewares.boiler-security-headers.headers.customFrameOptionsValue=SAMEORIGIN"
      - "traefik.http.middlewares.boiler-security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.boiler-security-headers.headers.customResponseHeaders.Content-Security-Policy=default-src 'self'; connect-src 'self' https://boiler.ba101.top wss://boiler.ba101.top; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'"

networks:
  web:
    external: true
