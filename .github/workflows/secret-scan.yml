name: Secret scan

# SEC-5: repo je JAVAN, a u njemu su bile stvarne tajne — lozinka Postgres baze
# (`env.md`, `backend/.env`), MySQL lozinka (`backend/env.md`, logovi) i Weather/
# Tuya ključevi (`docs/ENVIRONMENT_SETUP.md`). `.gitignore` ih nije spasio jer
# git ignoriše samo fajlove koji NISU praćeni; jednom dodan fajl ostaje praćen.
#
# Ovaj workflow gleda SAMO praćene fajlove i pada ako u njima ima nečega što
# izgleda kao stvarna tajna. Namjerno ide na svaki push (bez `paths` filtera):
# tajna može ući iz bilo kojeg direktorija.

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Cijela historija nije potrebna; skener gleda radno stablo.
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scan tracked files for secrets
        # Skener ima nula zavisnosti (samo `node:child_process` + `node:fs`),
        # pa ne treba `npm ci` — provjera traje sekundu.
        run: node scripts/audit/secret-scan.cjs
