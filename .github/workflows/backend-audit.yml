name: Audit checks

on:
  push:
    branches: [arena/1bfee051-boiler-control]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Manual dispatch is also restricted to this session's branch.
    if: github.ref == 'refs/heads/arena/1bfee051-boiler-control'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_DB: audit
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit -d audit"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://audit@127.0.0.1:5432/audit
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '5432'
      DATABASE_USER: audit
      DATABASE_NAME: audit
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Create ephemeral test-only configuration
        run: |
          test_value="$(openssl rand -hex 24)"
          echo "::add-mask::$test_value"
          echo "DATABASE_PASSWORD=$test_value" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$test_value" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/audit-uploads"
          echo "UPLOAD_ROOT_PATH=$RUNNER_TEMP/audit-uploads" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare isolated database and Prisma client
        id: prepare
        run: |
          npm run generate:prisma
          npx prisma migrate deploy
      - name: Reproduce notification authorization in disposable PostgreSQL
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          AUDIT_DISPOSABLE_POSTGRES: '1'
        run: node ../scripts/audit/http_postgres_repro.cjs --ci
      - name: Verify temporary Redis
        run: docker exec "${{ job.services.redis.id }}" redis-cli ping
      - name: Verify Redis lease primitives in disposable service
        env:
          AUDIT_DISPOSABLE_REDIS: '1'
          AUDIT_REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: node ../scripts/audit/redis_lease_ci.cjs --ci
      - name: Lint without modifying files
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          set +e
          npx eslint 'src/**/*.ts' 'test/**/*.ts' --ignore-pattern 'src/generated/**' --format json > "$RUNNER_TEMP/audit-eslint.json"
          result=$?
          node ../scripts/audit/ci_diagnostics.cjs eslint "$RUNNER_TEMP/audit-eslint.json"
          report_result=$?
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          exit "$report_result"
      - name: Type-check
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          set +e
          npx tsc --noEmit --incremental false --declaration false --types node,jest > "$RUNNER_TEMP/audit-tsc.txt" 2>&1
          result=$?
          node ../scripts/audit/ci_diagnostics.cjs tsc "$RUNNER_TEMP/audit-tsc.txt"
          report_result=$?
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          exit "$report_result"
      - name: Build
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: npm run build
      # API-2: ugovor mora ostati usklađen s komitovanim artefaktom.
      # `prepare` je već pokrenuo `generate:prisma`, pa generator može
      # instancirati aplikaciju. Pad znači da je neko promijenio rutu/DTO a
      # nije regenerisao `contracts/openapi.json` — tj. potencijalno
      # nekompatibilna promjena za frontend/mobile koji iz njega generišu tipove.
      - name: OpenAPI contract in sync (API-2)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: npm run openapi:generate -- --check
      - name: Existing tests and coverage
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          set +e
          npm test -- --runInBand --forceExit --coverage --coverageReporters=json-summary --coverageReporters=json --coverageReporters=text --coverageReporters=lcov --coverageReporters=clover --json --outputFile="$RUNNER_TEMP/audit-jest.json"
          result=$?
          node ../scripts/audit/jest_report.cjs "$RUNNER_TEMP/audit-jest.json"
          report_result=$?
          node ../scripts/audit/coverage_summary.cjs ../coverage/coverage-summary.json
          coverage_result=$?
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          if [ "$report_result" -ne 0 ]; then exit "$report_result"; fi
          exit "$coverage_result"
      - name: Existing integration tests
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          set +e
          npm run test:integration -- --json --outputFile="$RUNNER_TEMP/audit-integration.json"
          result=$?
          node ../scripts/audit/jest_report.cjs "$RUNNER_TEMP/audit-integration.json"
          report_result=$?
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          exit "$report_result"

  # FE2-16: frontend provjere. Odvojen job jer `test` ima
  # `defaults.run.working-directory: backend` i ovisi o postgres/redis
  # servisima koji frontendu nisu potrebni.
  frontend:
    if: github.ref == 'refs/heads/arena/1bfee051-boiler-control'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
