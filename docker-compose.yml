networks:
  boiler-control-network:
    name: boiler-control-network

services:
  boiler-control-backend:
    container_name: boiler-control-backend
    image: boiler-control-backend-image
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "3020:3020"
    env_file:
      - ./backend/.env
    environment:
      - TZ=Europe/Sarajevo
      - APP_PORT=3020
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /mnt/shared-app-files/boiler-control:/usr/src/app/uploads:rw
    networks:
      - boiler-control-network
    restart: unless-stopped


  boiler-control-frontend:
    networks:
      - boiler-control-network
    container_name: boiler-control-frontend
    image: boiler-control-frontend-image
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    depends_on:
      - boiler-control-backend
    ports:
      - "3021:3021"
    restart: unless-stopped
