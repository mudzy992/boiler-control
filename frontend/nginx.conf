server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ==========================================================
    # FE2-6: kompresija
    # ==========================================================
    # Bez ovoga se JS bundle (~2.9 MB nekompresovano) slao sirov.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ==========================================================
    # FE2-6: sigurnosni headeri
    #
    # VAZNO (nginx pravilo nasljedjivanja): ako `location` blok ima BILO KOJI
    # `add_header`, on NE nasljedjuje `add_header` direktive sa server nivoa.
    # Zato su headeri ponovljeni u `/assets/` bloku ispod.
    # ==========================================================

    # Ne moze slomiti aplikaciju — sigurno za ukljuciti.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # HSTS: browseri ga postuju samo preko HTTPS-a, pa je bezopasan i ako se
    # kontejner interno slusa na 80 (TLS terminira na Traefiku).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP je namjerno u REPORT-ONLY rezimu.
    #
    # Razlog: aplikacija koristi antd 5 (CSS-in-JS koji ubacuje <style> u
    # runtime) i @ant-design/plots (canvas/SVG). Strogi CSP koji bi blokirao
    # 'unsafe-inline' za stilove ili eventualni 'unsafe-eval' u plots biblioteci
    # slomio bi UI, a to se ne moze potvrditi bez e2e testa u browseru.
    # Report-Only salje izvjestaje i nista ne blokira.
    #
    # Kada se u browseru potvrdi da konzola ne prijavljuje CSP prekrsaje,
    # preimenovati direktivu u `Content-Security-Policy` da postane obavezujuca.
    #
    # connect-src pokriva OBA nacina deploja koja postoje u repu:
    #   - frontend/docker-compose.yml : VITE_API_URL=/backend/api (isti origin)
    #   - docker-compose.yml (korijen): VITE_API_URL=https://api.boiler-control.ba101.top/api
    # Zato je naveden i 'self' i eksplicitni API host; samo 'self' bi slomilo
    # drugi nacin deploja.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.boiler-control.ba101.top; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets
    location /assets/ {
        try_files $uri =404;

        expires 1y;
        add_header Cache-Control "public, immutable";

        # Ponovljeno namjerno: ovaj blok ima svoj `add_header`, pa server-level
        # headeri ovdje ne bi vazili (nginx pravilo nasljedjivanja).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Healthcheck
    location = /health {
        access_log off;

        default_type text/plain;
        return 200 "OK\n";
    }

    # Block hidden files
    location ~ /\. {
        deny all;
    }
}
